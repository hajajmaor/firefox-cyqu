worker_processes auto;
events { worker_connections 1024; }
http {
  access_log /dev/stdout; error_log /dev/stderr info;
  ssl_protocols TLSv1.3;
  # Prefer hybrid PQ group (exposed by OQS provider); graceful fallback included.
  ssl_ecdh_curve x25519_kyber768:x25519:secp256r1;
  ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256;
  ssl_prefer_server_ciphers on;
  ssl_certificate     /etc/nginx/tls/server.pem;
  ssl_certificate_key /etc/nginx/tls/server.key;

  server {
    listen 443 ssl http2;
    server_name demo.cyqu.org;

    # Pass negotiated group to app for diagnostics
    proxy_set_header X-TLS-Group $ssl_curve;

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass http://fastapi:8000;
    }
    location = /healthz { proxy_pass http://fastapi:8000/healthz; }
    location = /about  { proxy_pass http://fastapi:8000/about; }
  }
}

